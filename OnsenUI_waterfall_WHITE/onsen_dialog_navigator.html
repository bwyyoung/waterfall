<ons-page>
  <ons-toolbar>
    <div class="center">Dialog</div>
  </ons-toolbar>
  <ons-list ng-controller="DialogController">
    <ons-list-item ng-click="show('material.html')" modifier="tappable">
      Material Design
    </ons-list-item>
    <ons-list-item ng-click="show('login.html')" modifier="tappable">
      Login form
    </ons-list-item>
    <ons-list-item ng-click="show('navigator.html')" modifier="tappable">
      Navigator
    </ons-list-item>
    <ons-list-item ng-click="show('list.html')" modifier="tappable">
      List
    </ons-list-item>
  </ons-list>
</ons-page>

<ons-template id="material.html">
  <ons-dialog var="dialog" modifier="material" cancelable>
    <div style="padding: 0 22px 22px 22px">
      <p style="font-weight: 500;">Volumes</p>

      <p style="opacity: 0.6; font-size: 80%;">Media volume</p>
      <div>
        <input type="range" class="range range--material" style="float: right; width: 190px; margin-top: -4px;" value="30">
        <i class="zmdi zmdi-volume-up" style="font-size: 24px; opacity: 0.6"></i>
      </div>

      <p style="opacity: 0.6; font-size: 80%;">Alarm volume</p>
      <div>
        <input type="range" class="range range--material" style="float: right; width: 190px; margin-top: -4px;" value="40">
        <i class="zmdi zmdi-alarm" style="font-size: 24px; opacity: 0.6"></i>
      </div>
    </div>
  </ons-dialog>
</ons-template>

<ons-template id="navigator.html">
  <ons-dialog style="height: 160px;" var="naviDialog" cancelable>

    <ons-navigator var="myNav">
      <ons-toolbar inline>
        <div class="center">
          Navigator
        </div>
      </ons-toolbar>

      <div style="text-align: center">
        <p>
          This is a dialog with a navigator.
        </p>

        <p>
          <ons-button onclick="naviDialog.hide()">Close</ons-button>
          <ons-button onclick="myNav.pushPage('next.html')">Next</ons-button>
        </p>
      </div>
    </ons-navigator>
  </ons-dialog>
</ons-template>

<ons-template id="login.html">
  <ons-dialog var="dialog" cancelable>

    <ons-toolbar inline>
      <div class="center">
        Login
      </div>
    </ons-toolbar>

    <p>
      <input placeholder="Username" id="username" class="text-input">
    </p>

    <p>
      <input type="password" placeholder="Password" id="username" class="text-input">
    </p>

    <p>
      <ons-button modifier="large" ng-click="dialog.hide()">Sign in</ons-button>
    </p>

  </ons-dialog>
</ons-template>

<ons-template id="list.html">
  <ons-dialog var="dialog" cancelable>

    <ons-list>
      <ons-list-item modifier="tappable">
        Foo
      </ons-list-item>
      <ons-list-item modifier="tappable">
        Bar
      </ons-list-item>
      <ons-list-item modifier="tappable">
        Hoge
      </ons-list-item>
    </ons-list>

  </ons-dialog>
</ons-template>

<ons-template id="next.html">
  <ons-page>
    <ons-toolbar>
      <div class="center">Page 2</div>
    </ons-toolbar>

    <p style="text-align: center;">
      <ons-button onclick="myNav.popPage()">Back</ons-button>
    </p>
  </ons-page>
</ons-template>

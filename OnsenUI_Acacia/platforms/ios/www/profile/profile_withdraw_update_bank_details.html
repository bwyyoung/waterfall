
<div  style="background-image: url('components/monaca-onsenui/images/background_tile_dark_small.png');
width: 100%; height: 100%; position: fixed">
	<ons-toolbar fixed-style >
		<div class="left">
			<ons-toolbar-button ng-click="nav_profile_poppage();clear_update_bank_details()"  >
				<div style="font-family: nuiconfont !important; font-weight: bolder">&#xe002;</div>
			</ons-toolbar-button>
		</div>
		<div class="center" style="font-weight: bolder">Bank Details</div>
	</ons-toolbar>
	<div class="navigation_margin"></div>
	<div style="width: 100%" class="scrollable_nobounce">
	<form is='y-scroll-container' class="login-form" style="width: 70%; min-width: 200px; max-width: 800px;  font-family: 'default_font_1';
	margin: 0 auto 0 auto;"  novalidate
		  name='form'>
		<div class="navigation_margin" style="min-height: 800px; height: 100%">
			
			<br>
			<input
					ng-model='bank.name'
					name=''
					type="text"
					class="text-input--underbar  login_text"
					placeholder="Payment Bank"
					value=""
					style="text-align: left;"
			>
			<br>
			<input
					ng-model='bank.account'
					name=''
					type="text"
					class="text-input--underbar  login_text"
					placeholder="Bank Account No"
					value=""
					style="text-align: left;"
			>
			<br>
			<select
					ng-model='bank.account_type'
					name=''
					type="text"
					class="text-input--underbar  login_text"
					placeholder="Account Type"
					ng-change="check_update_bank_details()"
					value=""
					style="
						text-align: left;
					    display: block;
						width: 100%;
						margin: 0 auto;
						outline: none;
						height: 45px;
						padding-top: 0px;
						padding-bottom: 0px;
						color: black !important;
						background-color: white !important;
						border-radius: 10px;
						-webkit-user-select: text;
						font-weight: bold;
						-webkit-appearance: none;
						line-height: 20px;
						"
				>
				<option value="" disabled selected>Account Type</option>
				<option value="SA">Savings Account</option>
				<option value="CA">Current Account</option>

			</select>
			<br>
			<input
					ng-model='bank.branch'
					name=''
					type="text"
					class="text-input--underbar  login_text"
					placeholder="Branch"
					value=""
					style="text-align: left;"
			>
			<br>
			<input
					ng-model='bank.account_holder_name'
					name=''
					type="text"
					class="text-input--underbar  login_text"
					placeholder="Account Holder Name"
					value=""
					style="text-align: left;"
			>
			<br>
			<span ng-show="form.$dirty && check_update_bank_details()" style="color: red; font-weight: bolder">{{bank_error_message}}</span><br><br>
			<ons-button  ng-disabled="check_update_bank_details()" var="" class="profile-button" ng-click="click_update_bank_details()" >Update Bank Details</ons-button>
		</div>

	</form>
		</div>
</div>

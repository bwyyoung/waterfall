<ons-page>
	<ons-toolbar fixed-style >
	<div class="left">
				<ons-toolbar-button ng-click="nav_registration_poppage();"  >
					<div style="font-family: nuiconfont !important; font-weight: bolder">&#xe002;</div>
				</ons-toolbar-button>
	</div>
		<div class="center" style="font-weight: bolder">Login</div>
	</ons-toolbar>

		<form is='y-scroll-container' class="login-form scrollable_nobounce special_hide" style="width: 70%; min-width: 200px; max-width: 800px;  font-family: 'default_font_1';
	margin: 0 auto 0 auto;"  novalidate>
			<div class="navigation_margin" style="min-height: 568px; height: 100%">
				<br>
			<img src="css/custom_images/logo.png" class="logo">
			<br>

			<input type="email" class="text-input--underbar login_email"  ng-model="login.user_email" placeholder="Email" value=""
				   style="text-align: center;"
				   ng-init="login.user_email=''"
				   ng-keyup="check_input_login(login)" >


			<br>
			<input  type="password" class="text-input--underbar login_password" ng-model="login.user_password" placeholder="Password" value=""
					ng-init="login.user_password=''"
				   style=" text-align: center;" ng-keyup="check_input_login(login)">

			<ons-button  class="forgot-password" ng-click="forgot_password()">Forgot Password?</ons-button>
			<br>
			<ons-button  ng-disabled="check_input_login(login)" var="button_login" class="login-button" ng-click="click_login(login);">Login</ons-button>
				<img src="css/custom_images/powered_by_liveworkstech.svg" style="width: 7em; height: 5em">
			</div>

		</form>

</ons-page>

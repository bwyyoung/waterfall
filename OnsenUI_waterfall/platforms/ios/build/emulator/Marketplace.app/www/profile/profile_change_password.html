
<div  style="background-image: url('components/monaca-onsenui/images/background_tile_dark_small.png');
width: 100%; height: 100%; ">
	<ons-toolbar fixed-style >
		<div class="left">
			<ons-toolbar-button ng-click="nav_profile_poppage();"  >
				<div style="font-family: nuiconfont !important; font-weight: bolder">&#xe002;</div>
			</ons-toolbar-button>
		</div>
		<div class="center" style="font-weight: bolder">Set New Password</div>
	</ons-toolbar>
	<div class="navigation_margin"></div>
	<div style="width: 100%" class="scrollable">
	<form is='y-scroll-container' class="login-form " style="width: 70%; min-width: 200px; max-width: 800px;  font-family: 'default_font_1';
	margin: 0 auto 0 auto; "  novalidate
		  name='form'>
		<div class="navigation_margin"  >

			<span>Old Password</span>
			<input
					data-ng-model='newpassword.oldpassword'
					type="password"
					name='oldpassword'

					class="text-input--underbar login_password"
					placeholder="Old Password"
					value=""
					style="text-align: center;"
					required >
			<br>
			<span>New Password</span>
			<input
					data-ng-model='newpassword.password'
					type="password"
					name='password'

					class="text-input--underbar login_password"
					placeholder="New Password"
					value=""
					style="text-align: center;"
					required >
			<br>
			<span>Confirm Password</span>
			<input
					ng-model='newpassword.password_verify'
					data-password-verify="newpassword.password"
					name='confirm_password'

					type="password"
					class="text-input--underbar login_password"
					placeholder="Confirm Password"
					value=""
					style="text-align: center;"
					required >
			<br>
			<span ng-show="password_reset_verify(
			form.password.$error.required,
			form.confirm_password.$error.required,
			form.confirm_password.$error.passwordVerify, form.password.$dirty)
			" style="color: red; font-weight: bolder">{{get_error_message()}}</span>
			<br>
			<ons-button  ng-disabled="form.confirm_password.$error.passwordVerify
			|| form.password.$error.required || form.confirm_password.$error.required"
			 var="button_confirmpassword" class="login-button"
			 style="width: 99%"
						 ng-click="click_confirm_profile_update_password()" >Update Password</ons-button>
		</div>
	</form>
		</div>
</div>

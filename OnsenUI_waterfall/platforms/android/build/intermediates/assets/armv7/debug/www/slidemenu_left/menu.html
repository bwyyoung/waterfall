
<ons-page style="background-color: #00444D; background-image: none;"
 ng-swiperight="swiperight()"
ng-init="
sliding_menu_fix();
    backbutton_disable();
"
		  id="menu_page"
		  ng-controller="slidemenu_left"
		  initialisation
>
<ons-scroller id="menu_scroller" style="  overflow-y:visible;">

	<div style="    z-index: 101;   right: 0px; float: right; overflow: visible; margin: 0;  " >
		<ons-toolbar-button  style="overflow: visible" ng-click="app.slidingMenu.toggleMenu()">
			<div style="font-family: nuiconfont !important; font-weight: bolder; height: 2em">&#xe002;</div>
		</ons-toolbar-button>
	</div>
    <ons-list style="background-color: transparent;height:100%; min-height: 800px;width:100%; " id="menu_list" >

		<div  style="position: relative; width: 100%; z-index: 100">
			<div style="z-index: 100   ;
" ng-click="" class="user" profile-img ></div>
		</div>

		<div style="display: flex; width: 100%;"></div>
		<div class="dont-break-out-no-hyphen" style="text-align: center; vertical-align: middle;
		 width: 100%;font-size: 1.2em;
		 margin: 0.5em auto 0.3em auto;">{{get_name()}}</div>

		<div style="text-align: center; vertical-align: middle;
		width: 100%; font-family: 'Helvetica'">Level {{get_user_level()}}</div>
		<br>
			<div style="background-color: black;
			vertical-align: middle;font-size: 0.8em; font-weight: bolder;
			text-align: center; width: 100%; height: 44px;line-height: 44px;
			 font-family: 'Helvetica'">Credit: {{get_credit_formatted_string()}}</div>
		<br>
		<div ng-if="verify_user_registered_logged_in()" style="width: 100%">
			<div ng-show="!verify_user_credit_enough()" style="font-size: 0.9em; text-align: center; margin-bottom: 0.2em" >
				Oops... It looks like you do not have enough credit.
			</div>

			<ons-button class="addcredit-button" style="text-align: center" ng-click="show_form_addcredit()">
				Add Credit Now
			</ons-button>

		</div>
		<div ng-if="verify_user_guest_logged_in()" style="width: 100%">

			<ons-button class="addcredit-button" style="text-align: center" ng-click="show_form_splash()">
				Sign Up/Login
			</ons-button>
		</div>
		<br>

		<div style="background-color:black">
		<ons-list-item var="listitem_home"
            modifier="tappable" class="list__item__line-height"
            style="background-color:#028090"
            ng-click="page_load_home()"
            >
			<div class="slidemenu_icon_font">&#xe00c;</div>
			<div style="width: auto; overflow: hidden">&nbsp; Home</div>

        </ons-list-item>
        

        <ons-list-item var="listitem_loans_marketplace"
        style="background-color:#028090"
            modifier="tappable" class="list__item__line-height"
            ng-click="page_load_loans_marketplace()">
			<div class="slidemenu_icon_font">&#xe014;</div>
			<div style="width: auto; overflow: hidden">&nbsp; Loans Marketplace</div>

        </ons-list-item>


		<ons-list-item var="listitem_loans_portfolio" ng-show="bool_slidemenu_left_user_access"
        style="background-color:#02C39A"
            modifier="tappable" class="list__item__line-height"
             ng-class="{'slidemenu_left_listitem_disabled':!bool_slidemenu_left_user_access}"
            ng-click="page_load_loans_portfolio(bool_slidemenu_left_user_access)">
			<div class="slidemenu_icon_font">&#xe00a;</div>
			<div style="width: auto; overflow: hidden">&nbsp; My Loans Portfolio</div>

        </ons-list-item>
			<ons-list-item var="listitem_inbox" ng-show="bool_slidemenu_left_user_access"
						   style="background-color:#05668d"
						   ng-class="{'slidemenu_left_listitem_disabled':!bool_slidemenu_left_user_access}"
						   modifier="tappable" class="list__item__line-height"
						   ng-click="page_load_inbox(bool_slidemenu_left_user_access)">
				<div class="slidemenu_icon_font">&#xe00f;</div>
				<div style="width: auto; overflow: hidden">&nbsp; Chat Feedback</div>
			</ons-list-item>

        <ons-list-item var="listitem_profile" ng-show="bool_slidemenu_left_user_access"
        style="background-color:#2FC129"
            modifier="tappable" class="list__item__line-height"
             ng-class="{'slidemenu_left_listitem_disabled':!bool_slidemenu_left_user_access}"
            ng-click="page_load_profile(bool_slidemenu_left_user_access)">
			<div class="slidemenu_icon_font">&#xe012;</div>
			<div style="width: auto; overflow: hidden">&nbsp; My Profile</div>

        </ons-list-item>
        
		
		<ons-list-item var="listitem_contact" ng-show="bool_slidemenu_left_user_access"
		style="background-color:#05668d"
            modifier="tappable" class="list__item__line-height"
            
            ng-class="{'slidemenu_left_listitem_disabled':!bool_slidemenu_left_user_access}"
            ng-click="page_load_contact(bool_slidemenu_left_user_access)">
			<div class="slidemenu_icon_font">&#xe008;</div>
			<div style="width: auto; overflow: hidden">&nbsp; Contact Us / FAQ</div>

        </ons-list-item>
        
        
       <!-- <ons-list-item var="listitem_settings"
        style="background-color:#028090"
            modifier="tappable" class="list__item__line-height"

            ng-class="{'slidemenu_left_listitem_disabled':!bool_slidemenu_left_user_access}"
            ng-click="page_load_settings(bool_slidemenu_left_user_access)">
			<div class="slidemenu_icon_font">&#xe00e;</div>
			<div style="width: auto; overflow: hidden">&nbsp; Settings</div>

        </ons-list-item> -->
        
        <ons-list-item var="listitem_logout" ng-show="bool_slidemenu_left_user_access"
        style="background-color:#000000"
            modifier="tappable" class="list__item__line-height"
            
            ng-class="{'slidemenu_left_listitem_disabled':!bool_slidemenu_left_user_access}"
            ng-click="page_load_logout(bool_slidemenu_left_user_access)">
			<div class="slidemenu_icon_font">&#xe001;</div>
			<div style="width: auto; overflow: hidden">&nbsp; Logout</div>

        </ons-list-item>
	</div>
    </ons-list>
</ons-scroller>
</ons-page>

<ons-page ng-controller="search">

	<div class="vertical_menu">
		<div class="left" ng-click="slidemenu_open()" style="height: 2.5em;width: 100%;">
			<div class="slidemenu_icon_font" style="
                    text-align: center;
                    width: 100%;
                    line-height: 2.5em;
                ">&#xe019;</div>
		</div>
		<div class="vertical_text_nav">
		</div>
	</div>

	<div style="display: flex; flex-flow: row;height: 100%">
		<div ng-show="is_menu_open()" style=" margin: auto;
  position: absolute;
 left: 45%; top: 45%;">
			<ons-icon icon='fa-spinner' size="5em" spin='true'></ons-icon>
		</div>
		<div style="width: 100%; margin-left: auto;
         margin-right: auto;  position:relative" ng-show="!is_menu_open()" class="special_hide">
			<ons-navigator>
				<ons-toolbar fixed-style>
					<div class="center" style="font-weight: bolder">Search</div>
				</ons-toolbar>
				<div class="navigation_margin"></div>
				<div style="text-align: center">
					<div class="login-form" style="margin-top: 5%;overflow: visible;">
						<div class="light_title_font" style="font-size: 1.5em;margin: 0 auto 0 auto;">Rating</div>
						<div
								id="rateYo" style="margin: 0 auto 0 auto;" ng-init="init_search_rateyo()"></div>
						<br>
						<div class="light_title_font" style="font-size: 1.5em;margin: 0 auto 0 auto;">Loan Amount</div>
						<input ng-model="search.loan_amount"
							   class="clearable_dollar" type="text" name="password" value="" placeholder="" id="price"
							   style="margin: 0 auto 0 auto; color: gray; font-size: 1em;height: 1.4em; width: 90%;
						       border-radius: 8px;text-align: center"
							   autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
						/>
						<br>
						<br>
						<div class="light_title_font" style="font-size: 1.5em;margin: 0 auto 0 auto;">Terms</div>
						<input
								ng-init="init_loan_amount()"
								ng-model="search.loan_term_range_value"
								ng-change="update_loan_term_display_text();"
								ng-keyup="update_loan_term_display_text();"
								id="loan_term_range"
								min="0"
								value="100"
								max="99"
								ontouchstart="$('.clearable_dollar').blur();" type="range" class="range"
								style="width: 100%;    ">

						<span>{{search.loan_term_display_text}}</span>
						<br>
						<br>
						<br>
						<ons-button class="login-button" ng-click="click_search();">Search</ons-button>
						<br><br>
						<ons-button class="cancel-button" ng-click="click_cancel();">Cancel</ons-button>
					</div>
				</div>
			</ons-navigator>
		</div>

	</div>
</ons-page>

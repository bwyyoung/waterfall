<ons-page>
	<ons-toolbar fixed-style>
		<div class="left">
			<ons-toolbar-button ng-click="
			check_signup_back()">
				<div style="font-family: nuiconfont !important; font-weight: bolder">&#xe002;</div>
			</ons-toolbar-button>
		</div>
		<div class="center" style="font-weight: bolder">Sign Up</div>
	</ons-toolbar>
	<div class="navigation_margin"></div>
	<div style="width: 100%" class="scrollable" is='y-scroll-container'>
		<form name='form' class="login-form" style="min-width: 200px; max-width: 800px;  font-family: 'default_font_1';
	margin: 0 auto 0 auto; ">
			<div ng-init="init_signup();" class="navigation_margin"
				 style="min-height: 800px; height: 100%; width: 100%">
				<div>
					<div class='user' ng-click="showCameraDialog()" signup-img></div>
					<div class="form-row">
						<div style="font-family: 'default_font_1' !important;" ng-show="is_profile_photo_blank();">
							Profile Photo
						</div>
					</div>
				</div>
				<div style="width: 100%;  white-space:nowrap;">
					<label class="signup">&#xe018;</label>
					<div style="width: auto; overflow: hidden">

						<input
								type="email" class="
							signup_email
							text-input--underbar width-full"
								style=" ; "
								placeholder="Email" value="" ng-model="signup.email"
						>
					</div>
				</div>
				<br>
				<div style="width: 100%;">

					<div style="width: 50%; float:left;  white-space:nowrap">
						<label class="signup">&#xe012;</label
						>
						<div style="width: auto; overflow: hidden">

							<input


									type="text" class="text-input--underbar width-full"
									style=" ; text-align: left; margin-left: 0px;"
									placeholder="First Name" value="" ng-model="signup.firstname">
						</div>
					</div>

					<div style="width: 50%; float:right; white-space:nowrap">
						<label class="signup signup_name_separator">l</label
						>
						<div style="width: auto; overflow: hidden">
							<input

									type="text"
									style=" ; text-align: left; border-width-left: 1px;"
									class="text-input--underbar width-full" placeholder="Last Name" value=""
									ng-model="signup.lastname">
						</div>
					</div>
				</div>
				<br>
				<br>
				<br>
				<div style="width: 100%;">
					<label class="signup">&#xe017;</label>
					<div style="width: auto; overflow: hidden">
						<input


								required
								data-ng-model='signup.password'
								type="password"
								name='password'

								style=" ; "
								class="text-input--underbar width-full new_password" placeholder="Password" value="">
					</div>
				</div>
				<br>
				<div style="width: 100%;">
					<label class="signup">&#xe017;</label>
					<div style="width: auto; overflow: hidden">
						<input


								required
								ng-model='signup.password_verify'
								data-password-verify="signup.password"
								name='confirm_password'

								type="password"
								style=" ; "
								class="text-input--underbar width-full new_password" placeholder="Confirm Password"
								value=""
						></div>
				</div>
				<br>
				<input
						id="country"
						ng-model='signup.country'
						name=''
						type="text"
						class="text-input--underbar width-full  login_text"
						placeholder="Please Select Country"
						value=""
						style="text-align: left;"
				>
				<br>
				<div style="width: 100%;">
					<label class="signup">&#xe009;</label>
					<div style="width: auto; overflow: visible" id='phone_container'>
						<!--todo - Validate phone number -->
						<input
								id="phone"
								type="number"
								ng-keyup="signup_phone_verify()"
								ng-keydown="signup_phone_verify()"

								style=" width: 100%; "
								class="text-input--underbar width-full" placeholder="Phone Number" value="">
					</div>
				</div>
				<br><br>
				<div class="form-row" style="font-family: 'default_font_1' !important; text-align: center">
					Date of Birth
				</div>
				<div style="width: 100%;overflow: visible">
					<div id='birthday_popup' ng-click='show_birthday_native_datepicker()' style="
				width: 98%;
				background: none; white-space: nowrap; text-align: center;  overflow: visible">
						<input
								ng-model="signup.birthday_day"
								id='birthday_day' type="text" class="text-input--underbar" style="border-bottom: 1px solid #8F8F8F !important;
						text-align: center; width: 24%;  opacity: 1 !important;" placeholder="Date" value="" disabled>
						<input
								ng-model="signup.birthday_month"
								id='birthday_month' type="text" class="text-input--underbar" style="border-bottom: 1px solid #8F8F8F !important;
						text-align: center; width: 50%; opacity: 1 !important;" placeholder="Month" value="" disabled>
						<input
								ng-model="signup.birthday_year"
								id='birthday_year' type="text" class="text-input--underbar" style="border-bottom: 1px solid #8F8F8F !important;
						text-align: center; width: 24%; opacity: 1 !important;" placeholder="Year" value="" disabled>
					</div>
				</div>
				<br>
			<span ng-show=" form.$dirty &&
			signup_verify(password_reset_verify(
			form.password.$error.required,form.confirm_password.$error.required,form.confirm_password.$error.passwordVerify, form.password.$dirty))"
				  style="color: red; font-weight: bolder">{{error_message}}</span>
				<br>
				<div class="vspc form-row">
					<ons-button
							ng-disabled="form.$pristine || signup_verify(
						password_reset_verify(form.password.$error.required,form.confirm_password.$error.required,form.confirm_password.$error.passwordVerify, form.password.$dirty)) || signup_phone_verify()"
							class="login-button" ng-click="page_load_confirm_signup()"
							style="width: 93%;">Next
					</ons-button>
				</div>
			</div>
		</form>
	</div>
</ons-page>

<ons-page>
	<ons-toolbar fixed-style >
		<div class="left">
			<ons-toolbar-button ng-click="nav_registration_poppage();"  >
				<div style="font-family: nuiconfont !important; font-weight: bolder">&#xe002;</div>
			</ons-toolbar-button>
		</div>
		<div class="center" style="font-weight: bolder">Set New Password</div>
	</ons-toolbar>

	<form is='y-scroll-container' class="login-form scrollable_nobounce" style="width: 70%; min-width: 200px; max-width: 800px;  font-family: 'default_font_1';
	margin: 0 auto 0 auto;"  novalidate
		  name='form'>
		<div class="navigation_margin" style="min-height: 568px; height: 100%">
			<br>
			<img src="css/custom_images/logo.png" class="logo">
			<br>
			<input type="email" class="text-input--underbar login_email" placeholder="Email" value=""
				   style="text-align: center;     background-color: grey !important; color: white !important;
				   border-bottom: none; opacity: 1"
				   ng-value="temp_login_email" disabled>
			<br>
			<input
					data-ng-model='newpassword.password'
					type="password"
					name='password'

					class="text-input--underbar login_password"
					placeholder="New Password"
					value=""
					style="text-align: center;"
					required >
			<br>
			<input
					ng-model='newpassword.password_verify'
					data-password-verify="newpassword.password"
					name='confirm_password'

					type="password"
					class="text-input--underbar login_password"
					placeholder="Confirm Password"
					value=""
					style="text-align: center;"
					required >
			<br>
			<span ng-show="password_reset_verify(
			form.password.$error.required,
			form.confirm_password.$error.required,
			form.confirm_password.$error.passwordVerify, form.password.$dirty)
			" style="color: red; font-weight: bolder">{{error_message}}</span>
			<br>
			<br>
			<ons-button  ng-disabled="form.confirm_password.$error.passwordVerify
			|| form.password.$error.required || form.confirm_password.$error.required"
						 var="button_confirmpassword" class="login-button" ng-click="click_password_reset_confirm(newpassword.password_verify)" >OK</ons-button>
			<img src="css/custom_images/powered_by_numoni.svg" style="width: 7em; height: 5em">
		</div>

	</form>
</ons-page>

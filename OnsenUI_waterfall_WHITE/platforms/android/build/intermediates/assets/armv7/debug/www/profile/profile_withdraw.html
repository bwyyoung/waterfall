<div style="background-color: #E6E6E6;
width: 100%; height: 100%; padding-top: 20%; "
	 id="div_withdraw_1" is='y-scroll-container'>

	<ons-toolbar fixed-style>
		<div class="left">
			<ons-toolbar-button ng-click="nav_profile_poppage()">
				<div style="font-family: nuiconfont !important; font-weight: bolder">&#xe002;</div>
			</ons-toolbar-button>
		</div>
		<div class="center" style="font-weight: bolder">Withdraw</div>
	</ons-toolbar>
	<div class="navigation_margin"></div>
	<div style="
      margin: 50px auto 0 auto;
    position: relative;
    width: 15em; height: 22em; background-color: white; overflow: visible">

		<div class="user" ng-style="setProfileImage"
			 style="transform: translateY(-50%) !important;    background-color: inherit;"></div>
		<br>
		<form name='credit_form'
			  style="display: table; position: relative; width: 100%; height: 100%;    transform: translateY(-16%);">
			<div class="light_title_font dont-break-out-no-hyphen" style="
					text-align: center;
					width: 100%;font-size: 1.2em">{{get_username()}}
			</div>
			<div style="text-align: center;
		width: 100%; font-size: 0.7em; margin-bottom: 0.7em;">Level {{get_user_level()}}
			</div>

			<div style="text-align: center;
		width: 100%; font-size: 0.7em; font-weight: bolder; margin-bottom: 0.4em">Withdraw:
			</div>
			<input ng-model="withdraw_data.input_withdraw" ng-init="init_withdraw_box()" class="clearable_dollar"
				   type="text" name="password" value="" placeholder="" id="price" autocomplete="off" autocorrect="off"
				   autocapitalize="off" spellcheck="false"
				   style=" margin: 0 auto 0.7em auto; color: gray;	font-size: 1em;	height: 1.4em;	width: 70%;	border-radius: 8px;display: block;    text-align: center;"/>

			<div style="text-align: center;
		width: 100%; font-size: 0.7em; font-weight: bolder; ">Credit Balance:
			</div>

			<div style="
			font-size: 1em;
			text-align: center; width: 100%;margin-bottom: 0.7em;
			 ">{{get_credit_formatted_string()}}
			</div>

			<ons-button ng-disabled="check_input_withdraw_before_submit()"
						class="login-button" ng-click="click_submit_withdraw()"
						style="margin: 0 auto 0.5em auto; width: 80%; display: block;">Withdraw
			</ons-button>

			<ons-button class="cancel-button" ng-click="click_cancel_withdraw()" style="margin: 0 auto 0 auto; width: 80%;
    display: block;">Cancel
			</ons-button>

		</form>
	</div>

</div>

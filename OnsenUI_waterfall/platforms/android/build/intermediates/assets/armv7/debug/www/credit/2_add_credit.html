<div  style="background-image: url('components/monaca-onsenui/images/background_tile_dark_small.png');
width: 100%; height: 100%; padding-top: 20%">
id="div_add_credit_1" is='y-scroll-container'>
	<ons-toolbar fixed-style>
		<div class="left">
			<ons-toolbar-button ng-click="nav_credit_poppage()">
				<div style="font-family: nuiconfont !important; font-weight: bolder">&#xe002;</div>
			</ons-toolbar-button>
		</div>
		<div class="center" style="font-weight: bolder">Add Credit</div>
	</ons-toolbar>
	<div style="
      margin: 50px auto 0 auto;
    position: relative;
    width: 15em; height: 22em; background-color: #05668D; overflow: visible">

		<div class="user" ng-style="setProfileImage" style="transform: translateY(-50%) !important;    background-color: inherit;"></div>
<form  name='credit_form' style="display: table; position: relative; width: 100%; height: 100%;    transform: translateY(-16%);overflow: visible;">
		<div class="light_title_font dont-break-out-no-hyphen" style="
					text-align: center;
					width: 100%;font-size: 1.2em">{{credit_data.username}}</div>
		<div style="text-align: center;
		width: 100%; font-size: 0.7em; margin-bottom: 0.7em;">Level {{credit_data.level}}</div>

		<div style="text-align: center;
		width: 100%; font-size: 0.7em; font-weight: bolder; margin-bottom: 0.4em">Credit Balance:</div>

		<div style="
			font-size: 1em;
			text-align: center; width: 100%;margin-bottom: 0.7em;
			 ">{{get_credit_formatted_string()}}</div>

	<div style="text-align: center;
		width: 100%; font-size: 0.7em; font-weight: bolder; margin-bottom: 0.4em">Add Credit:</div>
		<input ng-model="credit_data.input_credit" ng-init="init_credit_box()" class="clearable_dollar" type="text" name="password" value="" placeholder="" id="price"  autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
			   style=" margin: 0 auto 0.7em auto; color: gray;	font-size: 1em;	height: 1.4em;	width: 70%;	border-radius: 8px;display: block;    text-align: center;"/>

	<ons-button  ng-disabled="check_input_credit_before_submit()"
				 class="login-button" ng-click="Click_Submit_Credit()" style="margin: 0 auto 0.5em auto; width: 80%; display: block;">Add Credit Now</ons-button>

	<ons-button  class="cancel-button" ng-click="Click_Cancel_Credit()" style="margin: 0 auto 0 auto; width: 80%;
    display: block;">Cancel</ons-button>

</form>
	</div>
</div>

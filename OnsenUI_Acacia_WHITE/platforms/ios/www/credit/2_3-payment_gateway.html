<ons-page>
	<div style="display: flex;
  flex-flow: row;height: 100%">
		<div ng-show="!is_payment_gateway_loaded()" style=" margin: auto;
  position: absolute;
 left: 45%; top: 45%;
    z-index: 1000;">
			<ons-icon icon='fa-spinner' size="5em" spin='true'></ons-icon>
		</div>

		<div style="width: 100%; margin-left: auto;
         margin-right: auto;  position:relative" class="special_hide">
			<ons-navigator var="nav_payment_gateway" animation="none" style="position: absolute;">
				<ons-toolbar fixed-style>
					<div class="left">
						<ons-toolbar-button ng-click="nav_credit_poppage()">
							<div style="font-family: nuiconfont !important; font-weight: bolder">&#xe002;</div>
						</ons-toolbar-button>
					</div>
					<div class="center" style="font-weight: bolder"
					>Payment Gateway
					</div>
					<div class="right" ng-click="nav_credit.pushPage('credit/3_results.html');">
						<ons-icon size="2em" icon='fa-arrow-right'></ons-icon>
					</div>
				</ons-toolbar>
				<div class="navigation_margin"></div>
				<div style="all: unset">
					<div style="width:100%;height:100%;overflow:scroll !important;
					-webkit-overflow-scrolling:touch !important" ng-show="is_payment_gateway_loaded()">
						<iframe ng-init="init_payment_gateway()"
								id="payment_gateway" src="http://www.numoni.com/news-events/"
								scrolling="yes" style="width:100%;height:100%" frameborder="0"
								sandbox="allow-same-origin allow-scripts"></iframe>
					</div>
				</div>
			</ons-navigator>

		</div>
	</div>
</ons-page>

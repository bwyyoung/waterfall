<ons-alert-dialog class="alert_fullscreen_blue" var="alertdialog"
				  ng-controller="password">
	<!-- need navbar here.-->
	<ons-toolbar fixed-style>
		<div class="left">
			<ons-toolbar-button ng-click="alertdialog.hide();">
				<div style="font-family: nuiconfont !important; font-weight: bolder">&#xe002;</div>
			</ONS-TOOLBAR-BUTTON>
		</div>
	</ons-toolbar>
	<div class="navigation_margin"></div>
	<form name='password_reset_email' class="login-form " style="   width: 70%;
									   position: relative;
									     top: 15%; overflow: visible;"
	>
		<div class="light_title_font" style="color: white; font-size: 2em; width: 100%; margin: -30% auto 0 auto;
  text-align: center; font-weight: bold">
			Reset Password
		</div>
		<br>
		<div style="font-family: Helvetica; color: white; width: 100%; margin: 0 auto 0 auto; font-size: 1em;
		text-align: center;">
			To reset your password, enter the email address you use to sign in to Marketplace.
		</div>
		<br>
		<input
				class="text-input--underbar login_email" value=""
				style="text-align: center;"

				ng-model="user_email"
				ng-init="user_email=''"

				type="email" name='email'
				placeholder="Email"
				value=""
				style="text-align: center;">
		<br>
		<ons-button ng-disabled='!password_reset_email.email.$valid || !user_email' class="login-button"
					ng-click="password_reset_email_validate(user_email); alertdialog.hide(); alertdialog.destroy(); alertdialog = null;">
			OK
		</ons-button>
	</form>

</ons-alert-dialog>

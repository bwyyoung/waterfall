<ons-alert-dialog style="z-index: 2147483647; width: 20em;" var="alertdialog" animation="default" animation="none"
				  cancelable ng-controller="loan_portfolio_details">
	<div class="alert-dialog-title">Total Investment Information</div>
	<div style="color: white;
        line-height: 1em;
    float: left;
    margin: 1em;">
		<ons-row class="marketplace-list-row-padding">
			<ons-row class="marketplace-list-row-padding2">
				<ons-col>Total Investment Amount</ons-col>
				<ons-col>
					<div style="float: right;">
						{{total_investment_reference[nw_loan_portfolio.MESSAGE_KEY_TOTAL_INVESTMENT_AMOUNT]}}
					</div>
				</ons-col>
			</ons-row>
			<ons-row class="marketplace-list-row-padding2">
				<ons-col>Total Investment Return</ons-col>
				<ons-col>
					<div style="float: right;">
						{{total_investment_reference[nw_loan_portfolio.MESSAGE_KEY_TOTAL_INVESTMENT_RETURN]}}
					</div>
				</ons-col>
			</ons-row>

			<ons-row class="marketplace-list-row-padding" style="margin-top: 0.3em;">
				<ons-button class="login-button" ng-click="alertdialog.hide();">OK</ons-button>
			</ons-row>
		</ons-row>
	</div>
</ons-alert-dialog>

<div  style="background-image: url('components/monaca-onsenui/images/background_tile_dark_small.png');
width: 100%; height: 100%;position: fixed ">
	<ons-toolbar fixed-style >
		<div class="left">
			<ons-toolbar-button ng-click="nav_profile_poppage();clear_update_address()"  >
				<div style="font-family: nuiconfont !important; font-weight: bolder">&#xe002;</div>
			</ons-toolbar-button>
		</div>
		<div class="center" style="font-weight: bolder">Update Address</div>
	</ons-toolbar>
	<div class="navigation_margin"></div>
	<div style="width: 100%" class="scrollable_nobounce">
		<form is='y-scroll-container' class="login-form" style="width: 70%; min-width: 200px; max-width: 800px;  font-family: 'default_font_1'; overflow: visible;
	margin: 0 auto 0 auto;"  novalidate
			  name='form'
		ng-init="init_update_address()">
			<div class="navigation_margin country_container" style="min-height: 800px; height: 100%">
			<br>
			<input
					ng-model='address.number'
					name=''
					type="text"
					class="text-input--underbar  login_text"
					placeholder="Home Address No."
					value=""
					style="text-align: left;"
			>
			<br>
			<input
					ng-model='address.street'
					name=''
					type="text"
					class="text-input--underbar  login_text"
					placeholder="Street"
					value=""
					style="text-align: left;"
			>
			<br>
			<input
					ng-model='address.village'
					name=''
					type="text"
					class="text-input--underbar  login_text"
					placeholder="Village"
					value=""
					style="text-align: left;"
			>
			<br>
			<input
					ng-model='address.state'
					name=''
					type="text"
					class="text-input--underbar  login_text"
					placeholder="State/Province"
					value=""
					style="text-align: left;"
			>
			<br>
			<input
					ng-model='address.postcode'
					name=''
					type="text"
					class="text-input--underbar  login_text"
					placeholder="Postal Code"
					value=""
					style="text-align: left;"
			>
			<br>
			<input
					id="country"
					ng-model='address.country'
					name=''
					type="text"
					class="text-input--underbar  login_text"
					placeholder="Country"
					value=""
					style="text-align: left;"
					readonly="readonly"
			>
			<br>
			<input
					id="city"
					ng-model='address.city'
					name=''
					type="text"
					class="text-input--underbar  login_text"
					placeholder="District/Town/City"
					value=""
					style="text-align: left;"
					readonly="readonly"
			>

				<br>
			<span ng-show="form.$dirty && check_update_address()" style="color: red; font-weight: bolder ;vertical-align: middle">{{address_error_message}}</span>
				<br><br>
			<ons-button  ng-disabled="check_update_address()" var="" class="profile-button" ng-click="click_update_address()" >Update Address</ons-button>
			</div>
		</form>
	</div>
</div>

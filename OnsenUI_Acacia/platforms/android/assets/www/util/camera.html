<ons-alert-dialog style="z-index: 2147483647;" var="alertdialog" animation="default"  animation="none" ng-controller="acacia_camera" cancelable>
	<div class="alert-dialog-title">Camera Options</div>
	<ons-list>
		<ons-list-item ng-click="takePhoto(); alertdialog.hide(); ">
			Take Photo
		</ons-list-item>
		<ons-list-item ng-click="choosePhoto();alertdialog.hide(); ">
			Choose Photo From Gallery
		</ons-list-item>
		<ons-list-item onclick="alertdialog.hide(); ">
			Cancel
		</ons-list-item>
	</ons-list>
</ons-alert-dialog>

<ons-page ng-controller="loan_portfolio">
	<div class="vertical_menu">
		<div class="left" ng-click="slidemenu_open()" style="height: 2.5em;width: 100%;">
			<div class="slidemenu_icon_font" style="
                    text-align: center;
                    width: 100%;
                    line-height: 2.5em;
                ">&#xe019;</div>
		</div>
		<div class="vertical_text_nav">
		</div>
	</div>

	<div style="display: flex;
  flex-flow: row;height: 100%">
		<div ng-show="is_menu_open()" style=" margin: auto;
  position: absolute;
 left: 45%; top: 45%;">
			<ons-icon icon='fa-spinner' size="5em" spin='true'></ons-icon>
		</div>
		<div style="width: 100%; margin-left: auto;
         margin-right: auto;  position:relative" ng-show="!is_menu_open()" class="special_hide">
			<ons-navigator var="nav_loans_portfolio" animation="none" style="position: absolute">
				<ons-toolbar fixed-style>
					<div class="center" style="font-weight: bolder">My Loans Portfolio</div>
				</ons-toolbar>
				<div class="navigation_margin"></div>
				<div style="background-color: #E6E6E6">
					<ons-row>
						<ons-col>
							<select
									ng-model='loans_portfolio.country'
									name=''
									type="text"
									class="text-input--underbar  login_text select_menu_form"
									ng-change="check_loans_portfolio_country()"
									value=""
									style="    font-size: 0.8em;">
								<option value="" disabled selected>Select Country</option>
								<option value="sg">Singapore</option>
								<option value="id">Indonesia</option>
								<option value="my">Malaysia</option>
								<option value="ph">Philippines</option>
							</select>
						</ons-col>
					</ons-row>
					<ons-row>
						<ons-col>
							<ons-button ng-disabled="" var="button_login" class="login-button"
										ng-click="click_select_column();"
										style="color: black !important; background-color: white !important;border: 0.5px solid grey;font-size: 0.8em;"
							>Select Column
							</ons-button>
						</ons-col>
					</ons-row>

					<ons-row>
						<ons-col>
							<select
									ng-model='loans_portfolio.txn_period'
									name=''
									type="text"
									class="text-input--underbar  login_text select_menu_form"
									ng-change="check_loans_portfolio_duration()"
									value=""
									style="background-color: orange !important;font-size: 0.8em;
							color: white !important;">
								<option value="" disabled selected>View Portfolio Return</option>
								<option value="month_6">Last 6 Months</option>
								<option value="month_12">Last 1 Year</option>
							</select>
						</ons-col>
					</ons-row>

					<ons-row>
						<ons-col>
							<ons-button ng-disabled="" var="button_login" class="login-button"
										ng-click="click_view_total_investment();"
										style="font-size: 0.8em;">View Total Investments
							</ons-button>
						</ons-col>
					</ons-row>
				</div>
				<div class="dont-break-out-no-hyphen"
					 style="font-weight: bolder;max-width: 100%; margin: 0 auto 0 auto; font-size: 0.8em;border-bottom: 1px solid grey;background-color: #E6E6E6; padding-bottom: 0em; padding-top: 1em">
					<ons-row height="1em" style="  ">
						<ons-col ng-show="show_column('LoanId')">
							<div align="center" class="dont-break-out-no-hyphen"
								 style="line-height: 1em; vertical-align: middle">Loan ID
							</div>
						</ons-col>
						<ons-col ng-show="show_column('InvestedDate')">
							<div align="center" class="dont-break-out-no-hyphen"
								 style="line-height: 1em; vertical-align: middle">Invested<br>Date
							</div>
						</ons-col>
						<ons-col ng-show="show_column('FundedDate')">
							<div align="center" class="dont-break-out-no-hyphen"
								 style="line-height: 1em; vertical-align: middle">Funded Date
							</div>
						</ons-col>
						<ons-col ng-show="show_column('MaturityDate')">
							<div align="center" class="dont-break-out-no-hyphen"
								 style="line-height: 1em; vertical-align: middle">Maturity Date
							</div>
						</ons-col>
						<ons-col ng-show="show_column('Tenure')">
							<div align="center" class="dont-break-out-no-hyphen"
								 style="line-height: 1em; vertical-align: middle">Tenure (Days)
							</div>
						</ons-col>
						<ons-col ng-show="show_column('InvestmentAmount')">
							<div ng-show="show_column('InvestmentAmount')" align="center"
								 class="dont-break-out-no-hyphen" style="line-height: 1em; vertical-align: middle">
								Investment<br>Amount
							</div>
						</ons-col>
						<ons-col ng-show="show_column('Rating')">
							<div align="center" class="dont-break-out-no-hyphen"
								 style="line-height: 1em; vertical-align: middle">Rating
							</div>
						</ons-col>
						<ons-col ng-show="show_column('NetReturn')">
							<div ng-show="show_column('NetReturn')" align="center" class="dont-break-out-no-hyphen"
								 style="line-height: 1em; vertical-align: middle">Net<br>Return
							</div>
						</ons-col>
						<ons-col ng-show="show_column('InvestmentReturnAmount')">
							<div align="center" class="dont-break-out-no-hyphen"
								 style="line-height: 1em; vertical-align: middle">Inv. Return Amt
							</div>
						</ons-col>
						<ons-col ng-show="show_column('InvestmentReturnPercentage')">
							<div align="center" class="dont-break-out-no-hyphen"
								 style="line-height: 1em; vertical-align: middle">Inv. Return %
							</div>
						</ons-col>
						<ons-col ng-show="show_column('RepaymentStatus')">
							<div ng-show="show_column('RepaymentStatus')" align="center"
								 class="dont-break-out-no-hyphen" style="line-height: 1em; vertical-align: middle">
								Repayment<br>Status
							</div>
						</ons-col>
					</ons-row>

					<div style="
					width: 100%;
					position: absolute !important;
					top: 20em; bottom: 3em;">
						<ons-page style="background: transparent !important; background-image: none !important; ">
							<ons-list id="loans_portfolio_list"
									  style="border-top: none;  border-bottom: none; background: none;"
									  class="scrollable" is='y-scroll-container'>
								<div style="-webkit-transform: translateZ(0);">
									<ons-list-item ng-repeat="loans_portfolio in get_loans_portfolios()"
												   ng-click="display_loan_portfolio_details(loans_portfolio)"
												   style="padding: 1em 0 1em 0; font-size: 0.7em; line-height: 1em;">
										<ons-row height="1em" style="border-bottom: 1px solid grey;">
											<ons-col ng-show="show_column('LoanId')">
												<div ng-bind="get_column_value(loans_portfolio, 'LoanId')"
													 align="center"></div>
											</ons-col>
											<ons-col ng-show="show_column('InvestedDate')">
												<div ng-bind="get_column_value(loans_portfolio, 'InvestedDate')"
													 align="center"></div>
											</ons-col>
											<ons-col ng-show="show_column('FundedDate')">
												<div ng-bind="get_column_value(loans_portfolio, 'FundedDate')"
													 align="center"></div>
											</ons-col>
											<ons-col ng-show="show_column('MaturityDate')">
												<div ng-bind="get_column_value(loans_portfolio, 'MaturityDate')"
													 align="center"></div>
											</ons-col>
											<ons-col ng-show="show_column('Tenure')">
												<div ng-bind="get_column_value(loans_portfolio, 'Tenure')"
													 align="center"></div>
											</ons-col>
											<ons-col ng-show="show_column('InvestmentAmount')">
												<div ng-bind="get_column_value(loans_portfolio, 'InvestmentAmount')"
													 align="center"></div>
											</ons-col>
											<ons-col ng-show="show_column('Rating')">
												<div ng-bind="get_column_value(loans_portfolio, 'Rating')"
													 align="center"></div>
											</ons-col>
											<ons-col ng-show="show_column('NetReturn')">
												<div ng-bind="get_column_value(loans_portfolio, 'NetReturn')"
													 align="center"></div>
											</ons-col>
											<ons-col ng-show="show_column('InvestmentReturnAmount')">
												<div ng-bind="get_column_value(loans_portfolio, 'InvestmentReturnAmount')"
													 align="center"></div>
											</ons-col>
											<ons-col ng-show="show_column('InvestmentReturnPercentage')">
												<div ng-bind="get_column_value(loans_portfolio, 'InvestmentReturnPercentage')"
													 align="center"></div>
											</ons-col>
											<ons-col ng-show="show_column('RepaymentStatus')">
												<div ng-bind="get_column_value(loans_portfolio, 'RepaymentStatus')"
													 align="center"></div>
												<ons-icon ng-show="show_column('RepaymentStatus')" icon='fa-info-circle'
														  size="1em"
														  style="float: right;"></ons-icon>
											</ons-col>
										</ons-row>
									</ons-list-item>
								</div>
							</ons-list>
						</ons-page>
					</div>
				</div>
			</ons-navigator>

		</div>
	</div>
</ons-page>

<ons-alert-dialog style="z-index: 2147483647; width: 15em;" var="alertdialog" animation="default"  animation="none"
				  cancelable ng-controller="loan_marketplace_loan_details">
	<div class="alert-dialog-title">Congratulations!</div>

	<ons-row class="marketplace-list-row" ng-show="current_investment.loaded" style="padding: 20px;  ">
		<div style="float: left!important;  margin-top: 0.4em; width: 100%;text-overflow: ellipsis;
    overflow: hidden;">

			<ons-row>
				<ons-row class="marketplace-list-row-padding">
					<div class="wordwrap"
						 style="width: 100%;top: 0px;
							margin-top: 0px;
							vertical-align: top;
							text-align: center;
							position: relative;
							font-size: 0.7em;">This investment was added to your portfolio.</div>
				</ons-row>
				<ons-row class="marketplace-list-row-padding">
					<ons-col align="center" width="2em" height="2em">
						<img class="user" style="width: 2em; height: 2em; margin: auto;" ng-src="{{current_investment.imgsrc}}"  class="item-thum">
					</ons-col>
					<br>
					<ons-col width="7em">
						<div style="margin-left: 0.5em">
							<ons-row>
								<span class="item-title">{{current_investment.title}}</span>
							</ons-row>
							<ons-row>
								<span class="item-label" style="color: white">{{current_investment.label}}</span>
							</ons-row>
							<ons-row>
								<div id='rateyo_details_{{current_investment.index}}' class="rateYo_details" style="margin: 0 auto 0 0;" ng-init="init_display_loan_details()"></div>
							</ons-row>
						</div>
					</ons-col>
				</ons-row>
			</ons-row>
			<ons-row class="marketplace-list-row-padding"></ons-row>
			<ons-row class="marketplace-list-row-padding"></ons-row>

			<ons-row class="marketplace-list-row-padding">
				<ons-button  class="login-button" ng-click="alertdialog.hide();">OK</ons-button>
			</ons-row>

		</div>
	</ons-row>

</ons-alert-dialog>

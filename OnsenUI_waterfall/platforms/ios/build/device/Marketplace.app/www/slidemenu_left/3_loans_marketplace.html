<ons-page  ng-controller="loan_marketplace">

    <div class="vertical_menu">
        <div class="left" ng-click="slidemenu_open()" style="height: 2.5em;width: 100%;">
            <div class="slidemenu_icon_font" style="
                    text-align: center;
                    width: 100%;
                    line-height: 2.5em;
                ">&#xe019;</div>
        </div>
        <div class="vertical_text_nav" >Loans Marketplace</div>

    </div>

    <div style="display: flex;
  flex-flow: row;height: 100%;" >


        <div ng-show="is_menu_open()" style=" margin: auto;
  position: absolute;
 left: 45%; top: 45%;">
             <ons-icon icon='fa-spinner' size="5em" spin='true' ></ons-icon>
        </div>

        <div   style="width: 100%; margin-left: auto;
         margin-right: auto;  position:relative" ng-show="!is_menu_open()" class="special_hide">
            <div style=" width: 89%; margin-left: auto; margin-right: auto;  position:relative" >
                <ons-toolbar-button  style="position: absolute;  right: 0%;  top: 0; " ng-click="show_form_search()">
                    <div class="slidemenu_icon_font">&#xe01a;</div>
                </ons-toolbar-button>
            </div>

                <div style=" width: 89%; height: 3.5em;" >
                    <div  style="font-size: 2em; margin-left: 5vw; margin-top: 1vh;">Feature</div>
                </div>

            <div style="bottom: 0;
                        width: 100%;
                        position: absolute !important;
                        top: 3.5em;">
                <ons-page
        style="background: transparent !important; background-image: none !important;
        position: absolute; height: 100%; 	overflow: auto; -webkit-overflow-scrolling: none;">
                    <div ng-show="false">
                        <div  class="rateYo rating_template" style="margin: 0 auto 0 0;"></div>
                    </div>

                    <ons-list id="loan_marketplace_list"
                  style="border-top: none;  border-bottom: none; background: none; height: 100%;">

                        <!-- iOS Fix for GPU Rendering of List below. We need to do a TranslateZ in order to activate faster
                        3D graphics rendering. As a result, I cannot use the pull hook for lists, because the
                        resulting rendering causes all list items to disappear from view. Maybe in future,
                        there might be a solution.

                        If we put this style into ons-list, it will cause the list items to fail rendering on Android.
                        If we put this style into each list item, the list items will have glitchy rendering on iOS.
                        Therefore, a separate div is necessary.

                        http://developer.telerik.com/featured/scroll-event-change-ios-8-big-deal/
                        "Update (September 25th 2014): Per a comment from Rick Byers my wording here is incorrect.
                        iOS does not pause JavaScript execution—it pauses painting.
                        So your app’s JavaScript will continue to run,
                        but any changes to the DOM will not be painted until the scroll action completes."
                        -webkit-transform: translateZ(0);
                        -->
                        <div style="-webkit-transform: translateZ(0);">

                        <ons-list-item   id="item_{{item.index}}"  modifier="nuinfo" class="item"

                                         ons-lazy-repeat="MyDelegate"
                                         ng-show="check_list_item_show(item)"
                         ng-click="click_listrow_information(item, $event)" ng-class="{active:isGroupShown(item)}" >
                            <ons-row class="marketplace-list-row" style="position: relative !important;">


                                <div style="float: left!important; margin-left: 0.4em; margin-top: 0.4em; width: 100%; min-width: 768px" >
                                        <span style='opacity: 0.7;' ng-show="item.loaded && item.error">
                                          {{item.error_message}}
                                        </span>
                                        <span style='opacity: 0.7;' ng-show="!item.loaded || !check_item_inview(item)">
                                          <ons-icon icon='fa-spinner' spin='true'></ons-icon>
                                          Loading Information...
                                        </span>
                                        <div ng-show="item.loaded && !item.error
                                        && check_item_inview(item)">
                                                <ons-row>
                                                          <ons-row >
                                                                <ons-col align="center" width="2em" height="2em">

                                                                    <img class="user" style="width: 2em; height: 2em; margin: auto;" ng-src="{{item.imgsrc}}"
                                                                         class="item-thumb">
                                                                </ons-col>
                                                                    <br>
                                                                <ons-col width="9em">
                                                                    <div style="margin-left: 0.5em; text-overflow: ellipsis;">
                                                                        <ons-row>
                                                                            <span class="item-title">{{item.title}}</span>
                                                                        </ons-row>
                                                                        <ons-row>
                                                                            <span class="item-label" >{{item.label}}</span>
                                                                        </ons-row>
                                                                        <ons-row>
                                                        <div bind-html-unsafe="item.rating_render"></div>
                                                                        </ons-row>
                                                                    </div>
                                                                </ons-col>

                                                        </ons-row>
                                                    </ons-row>
                                                    <ons-row  style="padding: 0.5em !important;">
                                                        <ons-col width="7em">
                                                            <ons-row class="marketplace-list-row-padding">
                                                                <div class="slidemenu_icon_font"
                                                                     style="font-size: 1.3em; padding-right: 0.1em">&#xe010;</div>
                                                                <div class="marketplace-list-numberholder">
                                                                    <div style="font-size: 0.6em; margin: -2px 0 0 0;">{{item.investment_formatted}}</div>
                                                                </div>
                                                            </ons-row >
                                                            <ons-row class="marketplace-list-row-padding">
                                                                <div class="slidemenu_icon_font"
                                                                     style="font-size: 1.3em; padding-right: 0.1em">&#xe020;</div>
                                                                <div class="marketplace-list-numberholder">
                                                                    <div style="font-size: 0.6em; margin: -2px 0 0 0;">{{item.duration +  ' ' + item.duration_type + '(s)'}}</div></div>
                                                            </ons-row>

                                                        </ons-col>
                                                        <ons-col width="7em">
                                                            <ons-row height="2em" class="marketplace-list-row-padding">
                                                                <div class="slidemenu_icon_font"
                                                 style="font-size: 1.3em; padding-right: 0.1em">&#xe00d;</div>
                                                                <div class="marketplace-list-numberholder">
                                                    <div style="font-size: 0.6em; margin: -2px 0 0 0;">{{item.return_formatted}}</div></div>
                                                            </ons-row>
                                                            <ons-row height="2em" class="marketplace-list-row-padding">
                                                                <div ng-click="click_invest_now($event, item)" class="marketplace-list-investnow" style="float: right">
                                                                    <div style="font-size: 0.7em; font-weight: bolder; margin: -2px 0 0 0;">Invest Now</div></div>
                                                            </ons-row>

                                                        </ons-col>
                                                    </ons-row>
                                        </div>

                                    </div>

                                </ons-row>
                             <div class="item-accordion" ng-show="isGroupShown(item)">
                                <div style="background-color: #028090;height: 126px;
    padding: 5px 5px 0px 5px;white-space: pre-wrap;">{{item.desc}}</div>
                            </div>

                        </ons-list-item>
                        </div>
                    </ons-list>

                </ons-page>
            </div>
        </div>
    </div>
</ons-page>
